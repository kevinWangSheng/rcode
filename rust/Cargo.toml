[workspace]
members = [
    "cc",
    "crates/cc-core",
    "crates/cc-http",
    "crates/cc-config",
    "crates/cc-auth",
    "crates/cc-permissions",
    "crates/cc-git",
    "crates/cc-memory",
    "crates/cc-api",
    "crates/cc-tools",
    "crates/cc-hooks",
    "crates/cc-mcp",
    "crates/cc-session",
    "crates/cc-agents",
    "crates/cc-query",
    "crates/cc-tui",
    "crates/cc-bridge",
    "spikes/tui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Claude Code Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Tracing / logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Filesystem / paths
dirs = "5"
glob = "0.3"
walkdir = "2"
tempfile = "3"

# Async trait
async-trait = "0.1"

# UUID generation
uuid = { version = "1", features = ["v4"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Regex
regex = "1"

# Unicode
unicode-normalization = "0.1"
unicode-width = "0.2"

# TUI testing: drive the real binary under a virtual terminal + parse the
# rendered VT stream back into a grid we can assert on. Used by cc-tui's
# pty-based regression tests; not pulled into release binaries.
portable-pty = "0.9"
# Pin to 0.15 because 0.16 requires unicode-width 0.2.1+ while ratatui 0.29
# pins `= 0.2.0`. See `scrollback()` in tests/pty.rs for the 0.15-specific
# underflow workaround we apply in exchange.
vt100 = "0.15"

# Keychain (macOS Keychain, Linux SecretService, Windows Credential Manager)
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }

# Crypto primitives for OAuth PKCE
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Internal crates
cc-core = { path = "crates/cc-core" }
cc-http = { path = "crates/cc-http" }
cc-config = { path = "crates/cc-config" }
cc-auth = { path = "crates/cc-auth" }
cc-api = { path = "crates/cc-api" }
cc-permissions = { path = "crates/cc-permissions" }
cc-memory = { path = "crates/cc-memory" }
cc-git = { path = "crates/cc-git" }
cc-tools = { path = "crates/cc-tools" }
cc-hooks = { path = "crates/cc-hooks" }
cc-mcp = { path = "crates/cc-mcp" }
cc-session = { path = "crates/cc-session" }
cc-agents = { path = "crates/cc-agents" }
cc-query = { path = "crates/cc-query" }
cc-bridge = { path = "crates/cc-bridge" }
cc-tui = { path = "crates/cc-tui" }
