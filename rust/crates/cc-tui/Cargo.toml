[package]
name = "cc-tui"
version.workspace = true
edition.workspace = true

[dependencies]
cc-core.workspace = true
cc-memory.workspace = true
cc-session.workspace = true
cc-query.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
unicode-width.workspace = true
chrono.workspace = true
anyhow.workspace = true

[[bin]]
# PTY-harness demo binary. Runs `run_tui` with `engine: None` and replays a
# scripted event sequence read from stdin. Used by `tests/pty.rs` to drive
# the full event loop without an API key.
name = "cc-tui-demo"
path = "src/bin/tui_demo.rs"

[dependencies.syntect]
# Pure-Rust regex engine (`fancy-regex`) so we don't drag in the `onig`
# C library. `default-fancy` already excludes `onig` but we disable
# default features first to be explicit — keeps the surface audit-able.
version = "5"
default-features = false
features = ["default-fancy"]
optional = true

[features]
# Default-off: enable syntax-highlighted fenced code blocks via `syntect`.
# Carries ~2 MiB of grammar data in the release binary, so it is gated
# behind an explicit opt-in per M5 AC-V7.
tui-syntect = ["dep:syntect"]

[dev-dependencies]
tempfile.workspace = true
portable-pty.workspace = true
vt100.workspace = true
