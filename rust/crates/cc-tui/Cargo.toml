[package]
name = "cc-tui"
version.workspace = true
edition.workspace = true

[dependencies]
cc-core.workspace = true
cc-memory.workspace = true
cc-session.workspace = true
cc-query.workspace = true
ratatui.workspace = true
crossterm.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
dirs.workspace = true
unicode-width.workspace = true

[features]
# Default-off: enable syntax-highlighted fenced code blocks via `syntect`.
# Carries ~2 MiB of grammar data in the release binary, so it is gated
# behind an explicit opt-in per M5 AC-V7. The feature is scaffolded now;
# the `syntect` dependency is not pulled in until the integration lands.
tui-syntect = []

[dev-dependencies]
tempfile.workspace = true
